name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/omnichat
      DIRECT_URL: postgresql://user:password@localhost:5432/omnichat
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: omnichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d omnichat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Build API
        run: npm run api:build

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test API
        run: npm test

      - name: Coverage report
        run: npm run test:cov
